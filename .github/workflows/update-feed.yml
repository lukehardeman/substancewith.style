name: Update newsletter feed

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:        # lets you run it by hand

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Substack feed
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          ok=0
          code="none"
          for url in "https://sbstncewstyle.substack.com/feed" "https://sbstncewstyle.substack.com/feed/"; do
            code=$(curl --silent --location --retry 2 -A "$UA" \
              -H "Accept: application/rss+xml, application/xml;q=0.9, */*;q=0.8" \
              -H "Accept-Language: en-US,en;q=0.9" \
              -D feed.hdr -o feed.tmp -w "%{http_code}" "$url" 2>/dev/null || true)
            echo "$url -> HTTP $code" >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" = "200" ] && grep -q "<rss" feed.tmp; then
              mv feed.tmp feed.xml
              ok=1
              break
            fi
          done
          if [ "$ok" -eq 0 ]; then
            hdr=$(head -n 6 feed.hdr 2>/dev/null | tr -d '\r' | tr '\n' ' ')
            body=$(head -c 200 feed.tmp 2>/dev/null | tr '\r\n' '  ')
            detail="HTTP $code | Headers: $hdr | Body: $body"
            echo "$detail" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Feed download failed::$detail"
            exit 1
          fi
          # drop the timestamp that changes every fetch, so we only commit real changes
          sed -i 's#<lastBuildDate>[^<]*</lastBuildDate>##' feed.xml

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          if git diff --cached --quiet; then
            echo "No new posts."
          else
            git commit -m "Update newsletter feed"
            git push
          fi

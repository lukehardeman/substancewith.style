name: Update newsletter feed

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:        # lets you run it by hand

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Substack feed
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            -A "Mozilla/5.0 (compatible; SWS-feed-sync/1.0)" \
            https://sbstncewstyle.substack.com/feed -o feed.xml
          # drop the timestamp that changes every fetch, so we only commit real changes
          sed -i 's#<lastBuildDate>[^<]*</lastBuildDate>##' feed.xml

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          if git diff --cached --quiet; then
            echo "No new posts."
          else
            git commit -m "Update newsletter feed"
            git push
          fi

name: Update newsletter feed

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:        # lets you run it by hand

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch posts through an RSS-to-JSON service
        run: |
          url="https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fsbstncewstyle.substack.com%2Ffeed"
          code=$(curl --silent --location --retry 3 --retry-delay 5 -o feed.raw -w "%{http_code}" "$url" || true)
          echo "rss2json -> HTTP $code" >> "$GITHUB_STEP_SUMMARY"
          CODE="$code" python3 - <<'PY'
          import json, re, html, sys, os
          code = os.environ.get("CODE", "?")
          try:
              d = json.load(open("feed.raw"))
          except Exception as e:
              d = {"status": "error", "message": "response was not JSON: %s" % e}
          if d.get("status") != "ok":
              msg = ("HTTP %s | %s" % (code, str(d)[:300])).replace("\n", " ")
              print("::error title=Feed download failed::" + msg)
              sys.exit(1)
          def strip(t):
              return re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", t or ""))).strip()
          out = []
          for it in d.get("items", [])[:12]:
              paras = [strip(p) for p in re.findall(r"<p[^>]*>(.*?)</p>", it.get("content", ""), re.S)]
              ex = next((p for p in paras if len(p) > 60), "")
              if len(ex) > 360:
                  ex = re.sub(r"\s+\S*$", "", ex[:360]) + "…"
              img = (it.get("enclosure") or {}).get("link") or it.get("thumbnail") or ""
              cats = it.get("categories") or []
              date = it.get("pubDate", "")
              if re.match(r"^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$", date):
                  date = date.replace(" ", "T") + "Z"
              out.append({"title": it.get("title", ""), "link": it.get("link", ""), "date": date,
                          "description": strip(it.get("description", "")), "image": img,
                          "tag": cats[0] if cats else "", "excerpt": ex})
          if not out:
              print("::error title=Feed download failed::no posts found in response")
              sys.exit(1)
          json.dump(out, open("posts.json", "w"), ensure_ascii=False, indent=1)
          print("Saved %d posts" % len(out))
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          if git diff --cached --quiet; then
            echo "No new posts."
          else
            git commit -m "Update newsletter posts"
            git push
          fi
